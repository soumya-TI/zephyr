#
# Display-less GT911 touch bring-up test: no DISPLAY, no LVGL (so no rendering
# path), just the I2C0 + GT911 input driver. If the GT911 probes, touches print
# as INPUT_ABS_X / INPUT_ABS_Y / INPUT_BTN_TOUCH events.

CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_INPUT_GT911=y
CONFIG_INPUT_GT911_INTERRUPT=y

CONFIG_LOG=y
CONFIG_INPUT_LOG_LEVEL_INF=y
CONFIG_I2C_LOG_LEVEL_INF=y
