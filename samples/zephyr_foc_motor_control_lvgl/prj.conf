# =============================================================================
# FOC motor control
# =============================================================================
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_NO_OPTIMIZATIONS=n
CONFIG_DEBUG_OPTIMIZATIONS=n
CONFIG_SPEED_OPTIMIZATIONS=n
CONFIG_SIZE_OPTIMIZATIONS=n

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=1536
CONFIG_SHELL_ARGC_MAX=10
CONFIG_SHELL_CMD_BUFF_SIZE=128

CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=-1

CONFIG_SHELL_CMDS=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
CONFIG_REQUIRES_FLOAT_PRINTF=y

CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_ECHO_STATUS=n

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Stack sizes.
# main() runs the FOC low-priority state machine — 2 KB is sufficient.
CONFIG_MAIN_STACK_SIZE=21000
# Stack sentinel: software canary at the bottom of every stack (no MPU).
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y

# =============================================================================
# LVGL + dummy display (no SPI/I2C yet)
# =============================================================================
CONFIG_DISPLAY=y

CONFIG_LVGL=y
CONFIG_INPUT=y
CONFIG_LV_Z_POINTER_INPUT=y

CONFIG_LV_Z_POINTER_INPUT_MSGQ_COUNT=128

CONFIG_INPUT_MODE_SYNCHRONOUS=y

# Widgets used by the motor control UI.
CONFIG_LV_USE_OBSERVER=y
CONFIG_LV_USE_THEME_SIMPLE=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_ROLLER=y
CONFIG_LV_USE_CHART=y
CONFIG_LV_USE_TABLE=y
CONFIG_LV_USE_CHECKBOX=y
CONFIG_LV_USE_OBJ_NAME=y

# Built-in fallback font required even though UI ships its own.
CONFIG_LV_FONT_MONTSERRAT_14=y

# AM13E2 is Cortex-M33 with full unaligned-access support, so alignment=1 is
# fine. Keep at 4 to match the vendored UI assets which were compiled with
# this guard set.
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_ATTRIBUTE_MEM_ALIGN_SIZE=4

# VDB at 5% of 320x240 = ~7.5 KB. Dummy display flushes to /dev/null so
# buffer size only affects how many lines are rendered per pass.
CONFIG_LV_Z_VDB_SIZE=5

CONFIG_HEAP_MEM_POOL_SIZE=4096

# =============================================================================
# Logging — deferred backend so LOG_INF never blocks the calling thread.
# The log thread runs at the lowest priority and only drains the buffer when
# no other thread is runnable.
# =============================================================================
CONFIG_LOG=y
CONFIG_LOG_PRINTK=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=10
CONFIG_LOG_DEFAULT_LEVEL=2
