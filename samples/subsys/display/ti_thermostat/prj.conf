CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_INPUT=y
CONFIG_LV_Z_POINTER_INPUT=y

# LVGL rendering for this UI is call-stack heavy; 4K overflows the main thread
# (garbage-PC hard fault). Give it room, and enable a software stack canary
# (the M0+ has no MPU) plus thread names so any overflow is reported clearly.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y

# RGB565 to match the ST7796S panel.
CONFIG_LV_COLOR_DEPTH_16=y

# Cortex-M0+ (ARMv6-M) cannot do unaligned loads. LVGL blends RGB565 image data
# with uint16_t/uint32_t reads, so the compiled-in image arrays must be aligned
# or the blender hard-faults. Default is 1 (byte-aligned) -> force 4.
CONFIG_LV_ATTRIBUTE_MEM_ALIGN_SIZE=4

# Subject/observer API and the "simple" theme the UI is authored against.
CONFIG_LV_USE_OBSERVER=y
CONFIG_LV_USE_THEME_SIMPLE=y

# Widgets instantiated by the thermostat UI.
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_SWITCH=y
CONFIG_LV_USE_ROLLER=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_USE_CHART=y
CONFIG_LV_USE_BAR=y

# The UI ships its own fonts, but LVGL still needs a built-in default font.
CONFIG_LV_FONT_MONTSERRAT_14=y

# Modest system heap; LVGL's own VDB/mem-pool are placed in sram1 by the
# shield's board conf.
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Vendored UI calls lv_obj_set_name_static() which requires LV_USE_OBJ_NAME.
CONFIG_LV_USE_OBJ_NAME=y

CONFIG_LOG=y
CONFIG_LV_Z_POINTER_INPUT_MSGQ_COUNT=128

# Synchronous input: the GT911 poll callback feeds LVGL's own 128-deep pointer
# queue directly, with NO intermediate input-subsystem thread/queue. In THREAD
# mode that intermediate queue (even widened) overflowed during a long full-screen
# bar repaint - the input thread is the same priority as the render thread, so it
# starved for the ~330ms of a big drag redraw and dropped events. The dropped one
# was often the touch RELEASE, which left LVGL latched in the pressed state
# (idle_ms stuck at 0, fps healthy) and blocked every subsequent nav tap. In
# synchronous mode a stall backs up only a handful of samples into the 128-deep
# LVGL queue, so the release is never dropped and the press clears on the next
# frame. Removes the "Event dropped, queue full, not blocking in syswq" storm.
CONFIG_INPUT_MODE_SYNCHRONOUS=y

# On this single-core M0+, a flush thread + double VDB just adds thread-switch
# overhead and starves the touch/input processing (single blocking SPI, no DMA).
# A single VDB with inline flush keeps the main loop cycling predictably
# (render -> flush -> service input). Screen transitions are instant (the nav
# buttons' fade animation was removed in screens/*_gen.c), which removes the
# expensive full-screen re-blend that was the worst offender.
