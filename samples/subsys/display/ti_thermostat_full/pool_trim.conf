# pool_trim.conf — applied via OVERLAY_CONFIG in CMakeLists.txt so it lands
# in EXTRA_CONF_FILE and is processed AFTER the shield's lp_mspm0g3519.conf
# (which otherwise forces CONFIG_LV_Z_MEM_POOL_SIZE back to 61440 = 93.75%).
#
# With only home + insights (rooms + schedule dropped), two screens need at most
# ~20-25 KB of LVGL pool at runtime.  50 KB (78.1% of sram1) leaves >2x
# headroom for style-array growth and transient allocations during screen
# switches, while bringing the static build-time LVGL_BUF metric below 88%.
CONFIG_LV_Z_MEM_POOL_SIZE=51200
