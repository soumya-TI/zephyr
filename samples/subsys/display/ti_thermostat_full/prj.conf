CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_INPUT=y
CONFIG_LV_Z_POINTER_INPUT=y

# LVGL rendering for this UI is call-stack heavy; 4K overflows the main thread
# (garbage-PC hard fault). Give it room, and enable a software stack canary
# (the M0+ has no MPU) plus thread names so any overflow is reported clearly.
CONFIG_MAIN_STACK_SIZE=8096
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y

# RGB565 to match the ST7796S panel.
CONFIG_LV_COLOR_DEPTH_16=y

# Cortex-M0+ (ARMv6-M) cannot do unaligned loads. LVGL blends RGB565 image data
# with uint16_t/uint32_t reads, so the compiled-in image arrays must be aligned
# or the blender hard-faults. Default is 1 (byte-aligned) -> force 4.
CONFIG_LV_ATTRIBUTE_MEM_ALIGN_SIZE=4

# Subject/observer API and the "simple" theme the UI is authored against.
CONFIG_LV_USE_OBSERVER=y
CONFIG_LV_USE_THEME_SIMPLE=y

# Float subjects: subject_now_temp uses lv_subject_init_float() and
# thermostat_logic.c reads it with lv_subject_get_float(). Without this the
# observer comparison between the float "now" temperature and the integer
# "target" setpoint cannot compile. Cortex-M0+ has no FPU; operations are
# done in software by the toolchain's soft-float library.
CONFIG_LV_USE_FLOAT=y

# Widgets instantiated by the thermostat UI (home + insights only).
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_BUTTON=y
# CONFIG_LV_USE_SWITCH removed: row_toggle (rooms screen) was the only user.
CONFIG_LV_USE_ROLLER=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_USE_CHART=y
# CONFIG_LV_USE_BAR removed: bar (row_room, rooms screen) was the only user.
# New in the full demo (not in the alternate):
CONFIG_LV_USE_ARC=y      # dial component uses lv_arc_create()
# CONFIG_LV_USE_SLIDER removed: base/slider wrapper has no callers in home+insights.

# The UI ships its own fonts, but LVGL still needs a built-in default font.
CONFIG_LV_FONT_MONTSERRAT_14=y

# Modest system heap; LVGL's own VDB/mem-pool are placed in sram1 by the
# shield's board conf.
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Vendored UI calls lv_obj_set_name_static() which requires LV_USE_OBJ_NAME.
CONFIG_LV_USE_OBJ_NAME=y

CONFIG_LOG=y

# LVGL pointer input queue: 32 is amply safe at 30ms GT911 polling (worst-case
# single-frame render enqueues ~10 events; 128 was wasting 6KB of sram0).
CONFIG_LV_Z_POINTER_INPUT_MSGQ_COUNT=32

# Synchronous input (matches the sibling ti_thermostat sample's proven fix): the
# GT911 poll feeds LVGL's pointer queue directly, with no intermediate input
# thread/queue that can overflow during a long dial repaint and drop the touch
# RELEASE (which latches LVGL pressed and blocks nav). The pointer glue coalesces
# each sample to one queue entry on sync, so MSGQ_COUNT=32 is ample.
CONFIG_INPUT_MODE_SYNCHRONOUS=y

# On this single-core M0+, a flush thread + double VDB just adds thread-switch
# overhead and starves the touch/input processing (single blocking SPI, no DMA).
# A single VDB with inline flush keeps the main loop cycling predictably.
