# Place LVGL VDB and memory pool in sram1 (LVGL_BUF, 64KB) to keep sram0 free.
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_VDB_ZEPHYR_REGION=y
CONFIG_LV_Z_VDB_ZEPHYR_REGION_NAME="LVGL_BUF"
CONFIG_LV_Z_MEM_POOL_SIZE=33792
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION=y
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION_NAME="LVGL_BUF"
