# This chip has a single 256KB sram0 bank (no separate sram1 like the
# mspm0g3519 variant), so the LVGL object mem-pool and render buffer (VDB)
# both come out of the normal heap in sram0 rather than a dedicated
# memory-region - tagging all of sram0 as a distinct "LVGL_BUF" region would
# overlap the kernel/app RAM that already lives there.
#
# VDB at 50% halves the 480x320 RGB565 frame (307200B) into two 153600B
# chunks per full-screen redraw, instead of ten 30720B chunks at 10% - cuts
# the visible progressive-fill banding without needing a full frame buffer,
# which at 300KB would not fit in this chip's 256KB RAM regardless.
# CONFIG_LV_Z_VDB_SIZE=30
# CONFIG_LV_Z_MEM_POOL_SIZE=131072
CONFIG_LV_Z_VDB_SIZE=20
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_MEM_POOL_SIZE=98304
CONFIG_LV_Z_FLUSH_THREAD=y
CONFIG_LV_Z_FLUSH_THREAD_STACK_SIZE=1024
CONFIG_LV_Z_FLUSH_THREAD_PRIORITY=-1

# Native MSPM0 hardware I2C for the GT911 capacitive touch controller.
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_GT911=y

# PERIOD_MS=30 (not 10): at 100Hz a vigorous drag produced ~100 events/s while a
# full-screen bar repaint takes up to ~300ms, so the 16-deep input queue
# overflowed ("Event dropped, queue full, not blocking in syswq") faster than it
# drained and the UI wedged. At 30ms the worst-case single-frame render enqueues
# <=10 events, which fits the (widened) queue, so it never overflows. 33Hz is
# still well within touch responsiveness.
CONFIG_INPUT_GT911_INTERRUPT=n
CONFIG_INPUT_GT911_PERIOD_MS=30

