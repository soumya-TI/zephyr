# UNICOMM SPI for display, UNICOMM I2C for GT911 touch
CONFIG_SPI=y
CONFIG_SPI_TI_UNICOMM=y
CONFIG_I2C=y
CONFIG_I2C_TI_UNICOMM=y
CONFIG_GPIO=y

# LVGL display
CONFIG_LV_Z_VDB_SIZE=3
# CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_MEM_POOL_SIZE=65536
# CONFIG_LV_Z_FLUSH_THREAD=y
# CONFIG_LV_Z_FLUSH_THREAD_STACK_SIZE=2048
# CONFIG_LV_Z_FLUSH_THREAD_PRIORITY=-1

# Input: GT911 capacitive touch (polling mode)
CONFIG_INPUT=y
CONFIG_INPUT_GT911=y
CONFIG_INPUT_GT911_INTERRUPT=n
CONFIG_INPUT_GT911_PERIOD_MS=30
# CONFIG_LOG=y
# CONFIG_INPUT_LOG_LEVEL_DBG=y
