# sram0 is the unified 128 KB region at 0x20200000 (see overlay).
# VDB and pool are ordinary static arrays in BSS — no named region needed.
#
# Budget (128 KB = 131,072 B):
#   kernel BSS + stacks       ~25,000 B  (empirical: 126,040 − 49,152 − 50,000 − 1,024)
#   2× VDB  8% × 320×480×2 B =  49,152 B  (2 × 24,576 B)
#   pool                      =  50,000 B
#   flush thread stack        =   2,048 B
#   ──────────────────────────────────────
#   total used                ~126,200 B  (≈ 96.3 % of 128 KB)
#
# Double-VDB + flush thread pipeline:
#   LVGL renders into buf[0] → posts to flush queue → yields
#   Flush thread calls display_write(buf[0]) → SPI DMA runs
#   LVGL renders into buf[1] concurrently (safe: different buffer)
#   LVGL posts buf[1] flush → blocks only if buf[0] DMA still in flight
#   On DMA done ISR → flush thread unblocks → dequeues buf[1] → next DMA
#   Result: render and SPI transmit overlap → ~1.5-2× frame throughput
#
# If the build overflows sram0, reduce VDB_SIZE by 1 (each step = 3,072 B × 2).
# 2,048 B flush thread stack: display_write → mipi_dbi → spi_transceive →
#   spi_mspm0_dma_tx_segment (struct dma_config + dma_block_config on stack)
#   is ~8 frames deep with ~100 B of local structs; 1,024 was overflowing.
CONFIG_LV_Z_VDB_SIZE=8
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_MEM_POOL_SIZE=55000
CONFIG_LV_Z_FLUSH_THREAD=y
CONFIG_LV_Z_FLUSH_THREAD_STACK_SIZE=1024
CONFIG_LV_Z_FLUSH_THREAD_PRIORITY=-1

# Native MSPM0 hardware I2C for the GT911 capacitive touch controller.
CONFIG_DMA=y
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_INPUT_GT911=y
# Polling (not interrupt) mode: the driver reads the GT911's current state every
# PERIOD_MS regardless of the INT edge. Under heavy render load an interrupt edge
# (especially the touch-release) can be missed, which leaves LVGL stuck in the
# pressed state and blocks nav taps. Polling self-corrects on the next read.
#
# PERIOD_MS=30 (not 10): at 100Hz a vigorous drag produced ~100 events/s while a
# full-screen bar repaint takes up to ~300ms, so the 16-deep input queue
# overflowed ("Event dropped, queue full, not blocking in syswq") faster than it
# drained and the UI wedged. At 30ms the worst-case single-frame render enqueues
# <=10 events, which fits the (widened) queue, so it never overflows. 33Hz is
# still well within touch responsiveness.
CONFIG_INPUT_GT911_INTERRUPT=n
CONFIG_INPUT_GT911_PERIOD_MS=30
