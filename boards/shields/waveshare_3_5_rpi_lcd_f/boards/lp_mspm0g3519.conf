# Use both SRAM banks (128KB total). The LVGL object mem-pool gets almost all of
# sram1 (Bank 1 = LVGL_BUF, 64KB) so it can hold the full UI plus the transient
# second screen during a transition; the render buffer (VDB) lives in sram0
# (Bank 0). Previously both shared sram1, leaving the pool too small - object
# allocation failed mid-transition and LVGL dereferenced the NULL spec_attr.
# Single render buffer in sram0 (Bank 0). 6% leaves headroom alongside the 16K
# main stack (8% overflowed sram0 by ~860B).
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION=y
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION_NAME="LVGL_BUF"

# Native MSPM0 hardware I2C for the GT911 capacitive touch controller.
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_INPUT_GT911=y
# Polling (not interrupt) mode: the driver reads the GT911's current state every
# PERIOD_MS regardless of the INT edge. Under heavy render load an interrupt edge
# (especially the touch-release) can be missed, which leaves LVGL stuck in the
# pressed state and blocks nav taps. Polling self-corrects on the next read.
#
# PERIOD_MS=30 (not 10): at 100Hz a vigorous drag produced ~100 events/s while a
# full-screen bar repaint takes up to ~300ms, so the 16-deep input queue
# overflowed ("Event dropped, queue full, not blocking in syswq") faster than it
# drained and the UI wedged. At 30ms the worst-case single-frame render enqueues
# <=10 events, which fits the (widened) queue, so it never overflows. 33Hz is
# still well within touch responsiveness.
CONFIG_INPUT_GT911_INTERRUPT=n
CONFIG_INPUT_GT911_PERIOD_MS=30
