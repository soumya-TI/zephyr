#
# Kconfig fragment for Waveshare ST7796S (SPI) + FT6336U (I2C) on LP-MSPM0G3519.
# Use with:
#   west build -b lp_mspm0g3519 samples/drivers/display \
#     -- -DEXTRA_DTC_OVERLAY_FILE=boards/ti/lp_mspm0g3519/lp_mspm0g3519_st7796s_ft6336u.overlay \
#        -DEXTRA_CONF_FILE=boards/ti/lp_mspm0g3519/prj_st7796s_ft6336u.conf

# The display sample requests 64KB heap for its pixel buffer.  sram0 is also
# 64KB so stacks + 64KB heap overflow it.  Cap heap at 32KB — enough for a
# 320×480 RGB565 pixel strip (largest alloc is ~26KB).
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_DISPLAY_LOG_LEVEL_DBG=y
# CONFIG_MIPI_DBI_LOG_LEVEL_DBG=y

# ── FT6336U capacitive touch via GPIO bit-bang I2C ──────────────────────────
# The MSPM0 has no hardware I2C Zephyr driver yet; use the software (bit-bang)
# I2C controller on PA28 (SDA) / PA31 (SCL).
CONFIG_I2C=y
CONFIG_I2C_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_FT6146=y
